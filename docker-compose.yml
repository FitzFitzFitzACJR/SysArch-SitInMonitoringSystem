# Local development database. App runs on the host with `npm run dev`.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ccs
      POSTGRES_PASSWORD: ccs
      POSTGRES_DB: ccs_sitin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccs -d ccs_sitin"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
